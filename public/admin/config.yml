backend:
  name: github
  repo: howellcalcifer/horizonting
  branch: main
  base_url: https://sveltia-cms-auth.richtbiscuit.workers.dev
collections:
  - name: "section" # Used in routes, e.g., /admin/collections/blog
    label: "Section" # Used in the UI
    folder: "src/content/sections" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in frontmatter
      - { label: "Layout", name: "layout", widget: "hidden", default: "../../layouts/Section.astro" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "pubDate", widget: "datetime" }
      - { label: "Icon", name: "icon", widget: "image", required: false, media_library: { allow_multiple: false }}
      - { label: "Body", name: "body", widget: "markdown" }
  - name: "section_order"
    label: "Section order"
    files:
      - name: "index"
        label: "Index page order"
        file: "src/data/section-order.json"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.section}}"
            hint: "Search for saved sections by title. If a newly saved section is missing, refresh the admin page and try again."
            field:
              label: "Section"
              name: "section"
              widget: "relation"
              collection: "section"
              search_fields: ["title"]
              value_field: "{{slug}}"
              display_fields: ["title"]
              options_length: 100
media_folder: "src/assets/images" # Location where files will be stored in the repo
public_folder: "/src/assets/images" # Section-relative path stored in frontmatter for Astro